name: Build Levi Freecam

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build tools
        run: |
          sdkmanager "platforms;android-28" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build zip

      - name: Build arm64-v8a levipack
        run: bash ./scripts/build.sh

      - name: Inspect package
        run: |
          unzip -l dist/arm64-v8a/levi-freecam.levipack
          file build/android-arm64-v8a-Release/out/arm64-v8a/liblevi_freecam.so
          readelf -l build/android-arm64-v8a-Release/out/arm64-v8a/liblevi_freecam.so | grep -E 'LOAD|Align' || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: levi-freecam-arm64-v0.1.0
          path: dist/arm64-v8a/levi-freecam.levipack

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/arm64-v8a/levi-freecam.levipack
